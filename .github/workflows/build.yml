# Patchy — CI builds (v0.0.969, 2026-11-07; v0.0.970: Windows pthreads via vcpkg, Linux build under xvfb; v0.0.972: actions v5 / Node 22 — Node 20 deprecated)
#
# Builds Patchy (Standalone, VST3, LV2, CLAP; + AU / Patchy FX on macOS), the
# example Pax and the unit tests on every push / pull request, on macOS,
# Windows, Ubuntu and Arch Linux (in a container, like the user's Garuda).
# Pass / fail only: nothing is uploaded (builds will be sold later — user,
# 2026-11-07). Free on a public repo (GitHub's standard runners).
#
# v0.0.976 — PRIVATE BUILDS for the user's own testing: Actions → Build →
# "Run workflow" → tick "private release". The same four builds then zip
# Patchy (every format + the Pax) per OS and attach the zips to a DRAFT
# release — drafts are only visible to people with write access to the repo
# (i.e. the owner), unlike artifacts, which any GitHub account can download
# from a public repo. Pushes stay pass / fail only.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      private_release:
        description: "Private release: attach the builds to a draft release (visible to you only)"
        type: boolean
        default: false

permissions:
  contents: write   # v0.0.976 — creating / filling the draft release

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}   # a push doesn't cancel a manual (private) run
  cancel-in-progress: true   # a newer push replaces a running build of the same branch

env:
  # v0.0.973 — a fixed job count: a bare `--parallel` means `make -j` with NO
  # limit, ~40 clangs at once on a 3-core / 7 GB macOS runner (swapping: the
  # macOS build crawled for 35+ min without finishing a single Patchy file)
  JOBS: 4
  CMAKE_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DPATCHY_COPY_PLUGINS=OFF
    -DPATCHY_FYI_BACKUP=OFF
    -DPATCHY_BUILD_TESTS=ON

jobs:
  # ── v0.0.976 — the draft release the private builds attach to ─────────────
  draft:
    name: Draft release (private)
    if: github.event_name == 'workflow_dispatch' && inputs.private_release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.make.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: make
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^project(Patchy VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt | head -1)
          TAG="private-v${VERSION}-run${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Patchy v${VERSION} — private build #${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Private test build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Draft: visible to the repo owner only — do not publish. Delete it once tested."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── macOS (universal arm64 + x86_64, as on the user's Mac) ────────────────
  macos:
    name: macOS
    needs: draft
    if: ${{ !cancelled() && !failure() }}   # runs on pushes too (draft skipped)
    timeout-minutes: 90   # v0.0.973 — a stuck run stops by itself
    runs-on: macos-latest   # v0.0.970 — macos-14 was retired ("not supported")
    env:
      JOBS: 3               # 3 cores / 7 GB: one clang per core (universal = two archs each)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Configure
        run: cmake -S . -B build $CMAKE_FLAGS
      - name: Build Patchy (Standalone, VST3, AU, LV2, CLAP) + Patchy FX
        run: cmake --build build --target Patchy_All PatchyFX_All Patchy_CLAP --parallel $JOBS
      - name: Build the Pax
        run: cmake --build build --target Pax_Install --parallel $JOBS
      - name: Unit tests
        run: |
          cmake --build build --target PatchyTests --parallel $JOBS
          ctest --test-dir build --output-on-failure
      - name: Package + attach to the draft release (private runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.private_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -e
          R=build/Patchy_artefacts/Release
          mkdir -p dist/Patchy/Pax
          for d in Standalone VST3 AU LV2 CLAP; do
            [ -d "$R/$d" ] && cp -R "$R/$d" dist/Patchy/ || true
          done
          [ -d build/PatchyFX_artefacts/Release/AU ] && cp -R build/PatchyFX_artefacts/Release/AU/. dist/Patchy/AU/ || true
          find build/pax -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) -exec cp {} dist/Patchy/Pax/ \;
          find dist -maxdepth 3 | sort > dist-contents.txt; cat dist-contents.txt
          ZIP="Patchy-${TAG#private-}-macOS.zip"
          # v0.0.978 — ad-hoc sign every bundle (a signature over the whole bundle):
          # with only the linker's signature on the executable, macOS kept
          # asking for the microphone (user, 2026-11-08); a Developer ID comes
          # with the paid-downloads work
          for b in dist/Patchy/Standalone/*.app dist/Patchy/VST3/*.vst3 dist/Patchy/AU/*.component dist/Patchy/CLAP/*.clap; do
            if [ -e "$b" ]; then codesign --force --deep --sign - "$b"; fi
          done
          find dist/Patchy/LV2 dist/Patchy/Pax -type f \( -name '*.so' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          codesign --verify --deep --strict dist/Patchy/Standalone/*.app && echo "Standalone signature OK"
          (cd dist && ditto -c -k --keepParent Patchy "../$ZIP")
          gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber

  # ── Windows (MSVC, Edge WebView2) ──────────────────────────────────────────
  windows:
    name: Windows
    needs: draft
    if: ${{ !cancelled() && !failure() }}   # runs on pushes too (draft skipped)
    timeout-minutes: 90   # v0.0.973 — a stuck run stops by itself
    defaults:
      run:
        shell: bash          # v0.0.973 — so $JOBS expands (pwsh only where asked)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: WebView2 SDK (NuGet — where JUCE's CMake looks for it)
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force -ErrorAction SilentlyContinue
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force
      - name: pthreads for mosquitto (vcpkg — static lib, dynamic CRT like JUCE)
        run: vcpkg install pthreads:x64-windows-static-md
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build $CMAKE_FLAGS
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
      - name: Build Patchy (Standalone, VST3, LV2, CLAP)
        run: cmake --build build --config Release --target Patchy_All Patchy_CLAP --parallel $JOBS
      - name: Build the Pax
        run: cmake --build build --config Release --target Pax_Install --parallel $JOBS
      - name: Unit tests
        shell: bash
        run: |
          cmake --build build --config Release --target PatchyTests --parallel $JOBS
          ctest --test-dir build -C Release --output-on-failure
      - name: Package + attach to the draft release (private runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.private_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -e
          R=build/Patchy_artefacts/Release
          mkdir -p dist/Patchy/Pax
          for d in Standalone VST3 AU LV2 CLAP; do
            [ -d "$R/$d" ] && cp -R "$R/$d" dist/Patchy/ || true
          done
          [ -d build/PatchyFX_artefacts/Release/AU ] && cp -R build/PatchyFX_artefacts/Release/AU/. dist/Patchy/AU/ || true
          find build/pax -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) -exec cp {} dist/Patchy/Pax/ \;
          find dist -maxdepth 3 | sort > dist-contents.txt; cat dist-contents.txt
          ZIP="Patchy-${TAG#private-}-Windows.zip"
          (cd dist && cmake -E tar cf "../$ZIP" --format=zip Patchy)
          gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber

  # ── Ubuntu ─────────────────────────────────────────────────────────────────
  ubuntu:
    name: Ubuntu 24.04
    needs: draft
    if: ${{ !cancelled() && !failure() }}   # runs on pushes too (draft skipped)
    timeout-minutes: 90   # v0.0.973 — a stuck run stops by itself
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config xvfb \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: cmake -S . -B build $CMAKE_FLAGS
      - name: Build Patchy (Standalone, VST3, LV2, CLAP)
        # under a virtual display: JUCE's LV2 step loads Patchy and opens its
        # editor, whose WebKit helper dies without a screen (v0.0.970)
        run: xvfb-run -a cmake --build build --target Patchy_All Patchy_CLAP --parallel $JOBS
      - name: Build the Pax
        run: cmake --build build --target Pax_Install --parallel $JOBS
      - name: Unit tests
        run: |
          cmake --build build --target PatchyTests --parallel $JOBS
          xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Package + attach to the draft release (private runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.private_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -e
          R=build/Patchy_artefacts/Release
          mkdir -p dist/Patchy/Pax
          for d in Standalone VST3 AU LV2 CLAP; do
            [ -d "$R/$d" ] && cp -R "$R/$d" dist/Patchy/ || true
          done
          [ -d build/PatchyFX_artefacts/Release/AU ] && cp -R build/PatchyFX_artefacts/Release/AU/. dist/Patchy/AU/ || true
          find build/pax -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) -exec cp {} dist/Patchy/Pax/ \;
          find dist -maxdepth 3 | sort > dist-contents.txt; cat dist-contents.txt
          ZIP="Patchy-${TAG#private-}-Ubuntu.zip"
          (cd dist && cmake -E tar cf "../$ZIP" --format=zip Patchy)
          gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber

  # ── Arch Linux (container — the user's Garuda is Arch-based) ───────────────
  arch:
    name: Arch Linux
    needs: draft
    if: ${{ !cancelled() && !failure() }}   # runs on pushes too (draft skipped)
    timeout-minutes: 90   # v0.0.973 — a stuck run stops by itself
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake git pkgconf nodejs npm xorg-server-xvfb github-cli \
            alsa-lib jack2 freetype2 fontconfig \
            libx11 libxcomposite libxcursor libxext libxinerama libxrandr libxrender \
            gtk3 webkit2gtk-4.1 glu mesa
      - uses: actions/checkout@v5
      - name: Trust the checkout (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure
        run: cmake -S . -B build $CMAKE_FLAGS
      - name: Build Patchy (Standalone, VST3, LV2, CLAP)
        # under a virtual display: JUCE's LV2 step loads Patchy and opens its
        # editor, whose WebKit helper dies without a screen (v0.0.970)
        run: xvfb-run -a cmake --build build --target Patchy_All Patchy_CLAP --parallel $JOBS
      - name: Build the Pax
        run: cmake --build build --target Pax_Install --parallel $JOBS
      - name: Unit tests
        run: |
          cmake --build build --target PatchyTests --parallel $JOBS
          xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Package + attach to the draft release (private runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.private_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -e
          R=build/Patchy_artefacts/Release
          mkdir -p dist/Patchy/Pax
          for d in Standalone VST3 AU LV2 CLAP; do
            [ -d "$R/$d" ] && cp -R "$R/$d" dist/Patchy/ || true
          done
          [ -d build/PatchyFX_artefacts/Release/AU ] && cp -R build/PatchyFX_artefacts/Release/AU/. dist/Patchy/AU/ || true
          find build/pax -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) -exec cp {} dist/Patchy/Pax/ \;
          find dist -maxdepth 3 | sort > dist-contents.txt; cat dist-contents.txt
          ZIP="Patchy-${TAG#private-}-Arch.zip"
          (cd dist && cmake -E tar cf "../$ZIP" --format=zip Patchy)
          gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
